services:
  mongodb:
    image: docker.1ms.run/library/mongo:7
    container_name: mym-mongo
    restart: always
    # 仅容器网络内可达（app 通过服务名 mongodb 连接），不映射宿主端口
    environment:
      MONGO_INITDB_DATABASE: mym-english
    volumes:
      - mym_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: mym-app
    restart: always
    ports:
      # 直接对外暴露：域名备案/证书就绪前先按 IP:端口 访问（http://<服务器IP>:8081）。
      # 8080 已被 data-show 占用，本项目固定用 8081，避免端口冲突。
      # 域名就绪后对外入口走 web-gateway 的 proxy_pass（见 networks.web），两者并存互不影响
      - "${APP_PORT:-8081}:3000"
    networks:
      default: {}
      web:
        # 网关侧用的唯一别名（各项目都叫 app，必须在 web 网络上区分开）
        aliases:
          - mym-app
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # MongoDB 连接串（容器网络内直连 mongodb 服务）
      MONGODB_URI: mongodb://mongodb:27017/mym-english
      # 上传目录（相对 /app，配合 mym_uploads 卷持久化）
      UPLOAD_DIR: uploads
      # 以下必须由宿主 .env 提供
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-14}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      # 第三方服务密钥（火山引擎豆包 / TTS、验证码加密）
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_MODEL: ${ARK_MODEL:-}
      TTS_APP_ID: ${TTS_APP_ID}
      TTS_TOKEN: ${TTS_TOKEN}
      TTS_RESOURCE_ID: ${TTS_RESOURCE_ID:-seed-tts-2.0}
      TTS_APP_KEY: ${TTS_APP_KEY:-aGjiRDfUWi}
      TTS_SPEAKER: ${TTS_SPEAKER:-zh_female_vv_uranus_bigtts}
      # 语音缓存容量上限（MB），超出后按最久未使用淘汰
      TTS_CACHE_MAX_MB: ${TTS_CACHE_MAX_MB:-500}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-please-change-me-32-bytes-secret}
    volumes:
      - mym_uploads:/app/uploads

volumes:
  mym_mongo:
  mym_uploads:

networks:
  # 与 web-gateway 及其它站点共用的外部网络，网关按别名 mym-app 反代过来。
  # 部署前需先执行一次：docker network create web
  web:
    external: true
    name: web